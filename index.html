<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indy 500 Pitch-In</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero__art" aria-hidden="true">
          <div class="track">
            <div class="track__lane track__lane--one"></div>
            <div class="track__lane track__lane--two"></div>
            <div class="track__lane track__lane--three"></div>
          </div>
        </div>
        <div class="hero__content">
          <div class="badge">
            <span class="icon">⚑</span>
            Race Day Pitch-In
          </div>
          <h1><span>Indy 500</span><span>Pitch In</span></h1>
          <p>Claim what you’re bringing, then mark it checked and taken when race day rolls in.</p>
          <button class="share" id="copyLink" type="button">
            <span class="icon">⧉</span>
            <span id="copyText">Copy text link</span>
          </button>
        </div>
      </section>

      <section class="board" aria-label="Pitch-in board">
        <div class="status-row">
          <div class="live-pill live-pill--loading" id="statusPill">
            <span class="icon">↻</span>
            <span id="statusText">Loading</span>
          </div>
          <div class="party-code" id="partyCode"></div>
        </div>

        <form class="add-form" id="addForm">
          <label>
            <span class="icon">◌</span>
            <input id="nameInput" placeholder="Your name" autocomplete="name" />
          </label>
          <label>
            <span class="icon">▤</span>
            <input id="itemInput" placeholder="What are you bringing?" />
          </label>
          <button type="submit">
            <span class="icon">+</span>
            Add item
          </button>
        </form>

        <div class="stats" aria-label="Pitch-in progress">
          <span id="totalCount">0 items</span>
          <span id="checkedCount">0 checked</span>
          <span id="takenCount">0 taken</span>
        </div>

        <div class="list" id="list"></div>

        <p class="setup-note" id="setupNote">
          Run <code>python3 server.py</code> to make the list update for everyone using this hosted app.
        </p>
      </section>
    </main>
    <script src="./src/app.js"></script>
  </body>
</html>
